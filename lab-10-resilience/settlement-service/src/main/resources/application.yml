server:
  port: 8082

spring:
  application:
    name: settlement-service
  datasource:
    url: jdbc:h2:mem:settlementdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update

grpc:
  server:
    enabled: ${GRPC_SERVER_ENABLED:false}
    port: ${GRPC_SERVER_PORT:9090}
