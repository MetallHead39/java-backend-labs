services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  settlement-service:
    build:
      context: ./settlement-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
      - "9090:9090"
    environment:
      GRPC_SERVER_ENABLED: "true"
      GRPC_SERVER_PORT: "9090"

  payment-service-1:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      INSTANCE_NAME: payment-service-1
      SETTLEMENT_TRANSPORT: ${SETTLEMENT_TRANSPORT:-grpc}
      SETTLEMENT_REST_URL: http://settlement-service:8082
      SETTLEMENT_GRPC_HOST: settlement-service
      SETTLEMENT_GRPC_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      settlement-service:
        condition: service_started

  payment-service-2:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8081"
    environment:
      INSTANCE_NAME: payment-service-2
      SETTLEMENT_TRANSPORT: ${SETTLEMENT_TRANSPORT:-grpc}
      SETTLEMENT_REST_URL: http://settlement-service:8082
      SETTLEMENT_GRPC_HOST: settlement-service
      SETTLEMENT_GRPC_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      settlement-service:
        condition: service_started
