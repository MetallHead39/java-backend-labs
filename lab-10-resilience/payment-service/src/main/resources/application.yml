server:
  port: 8081

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: always

integration:
  settlement:
    transport: ${SETTLEMENT_TRANSPORT:http}
    http:
      base-url: ${SETTLEMENT_REST_URL:http://localhost:8082}
      connect-timeout-ms: ${SETTLEMENT_HTTP_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${SETTLEMENT_HTTP_READ_TIMEOUT_MS:3000}
    grpc:
      host: ${SETTLEMENT_GRPC_HOST:localhost}
      port: ${SETTLEMENT_GRPC_PORT:9090}
      deadline-ms: ${SETTLEMENT_GRPC_DEADLINE_MS:2000}

resilience4j:
  retry:
    retry-aspect-order: 1
    instances:
      settlementService:
        maxAttempts: ${RESILIENCE_RETRY_MAX_ATTEMPTS:3}
        waitDuration: ${RESILIENCE_RETRY_WAIT_MS:300}ms
        retryExceptions:
          - com.payment.paymentservice.exception.RemoteServiceUnavailableException
        ignoreExceptions:
          - com.payment.paymentservice.exception.RemoteResourceNotFoundException
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      settlementService:
        slidingWindowSize: ${RESILIENCE_CB_WINDOW_SIZE:6}
        minimumNumberOfCalls: ${RESILIENCE_CB_MIN_CALLS:4}
        failureRateThreshold: ${RESILIENCE_CB_FAILURE_THRESHOLD:50}
        waitDurationInOpenState: ${RESILIENCE_CB_OPEN_WAIT_MS:10000}ms
        permittedNumberOfCallsInHalfOpenState: ${RESILIENCE_CB_HALF_OPEN_CALLS:2}
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.payment.paymentservice.exception.RemoteServiceUnavailableException
        ignoreExceptions:
          - com.payment.paymentservice.exception.RemoteResourceNotFoundException

scheduler:
  reconciliation:
    delay-ms: ${SCHEDULER_RECONCILIATION_DELAY_MS:5000}
    lock-at-most: ${SCHEDULER_RECONCILIATION_LOCK_AT_MOST:PT10S}
    lock-at-least: ${SCHEDULER_RECONCILIATION_LOCK_AT_LEAST:PT4S}
